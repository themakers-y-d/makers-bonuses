# Audit only (branch animation-ci, never main): runs the PUBLISHED style-maker skill the way SKILL.md tells an agent to,
# on macOS and Windows, including a Hebrew+space Windows profile and a CRLF-written install.sh.
name: animation-ci
on:
  push:
    branches: [animation-ci]
  workflow_dispatch:

env:
  # simulate a customer machine with no Python of its own: uv must download its managed Python into ~/reel-studio/tools
  UV_PYTHON_PREFERENCE: only-managed
  # the FIXED skill files of this commit (immutable raw URL, no CDN staleness)
  RAW: https://raw.githubusercontent.com/themakers-y-d/makers-bonuses/${{ github.sha }}/skills/style-maker

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      AUDIT_MODEL: ivrit
    steps:
      - uses: actions/checkout@v4
      - name: INSTALL.md steps 1-3 (Mac line, full target path, run from another folder)
        shell: bash
        run: |
          mkdir -p ~/.claude/skills/style-maker
          for f in SKILL.md axes.md kit.py; do curl -fsSL -o ~/.claude/skills/style-maker/$f "$RAW/$f"; done
          ls -la ~/.claude/skills/style-maker; head -1 ~/.claude/skills/style-maker/SKILL.md; ! grep -l '^404' ~/.claude/skills/style-maker/*
      - name: place the owner's video (Hebrew name with a space, on the Desktop)
        shell: bash
        run: mkdir -p ~/Desktop && cp ci/animation/test-reel.mp4 ~/Desktop/"הסרטון שלי.mp4"
      - name: skill part 1 (step 1, install base, libs in background then exit)
        shell: bash
        run: bash ci/animation/run-skill.sh part1
      - name: skill part 2 (wait, model, doctor, steps 7-15)
        shell: bash
        run: bash ci/animation/run-skill.sh part2 "$HOME/Desktop/הסרטון שלי.mp4"
      - name: Mac non-regression, old kit.py (main) vs new kit.py on the same job
        shell: bash
        run: bash ci/animation/nonreg.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mac-logs, path: audit-logs }

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: plain
            model: ivrit
            hebrew: '0'
            crlf: '0'
          - variant: hebrew-space-profile
            model: ivrit
            hebrew: '1'
            crlf: '0'
          - variant: crlf-install-sh
            model: small
            hebrew: '0'
            crlf: '1'
    env:
      AUDIT_MODEL: ${{ matrix.model }}
      AUDIT_CRLF: ${{ matrix.crlf }}
    steps:
      - uses: actions/checkout@v4
      - name: Hebrew + space profile (C:\Users\דנה כהן), OneDrive Desktop
        if: matrix.hebrew == '1'
        shell: pwsh
        run: |
          $p = "C:\Users\דנה כהן"
          foreach ($d in @($p, "$p\AppData\Local\Temp", "$p\AppData\Roaming")) { New-Item -ItemType Directory -Force $d | Out-Null }
          "HOME=$p" | Add-Content $env:GITHUB_ENV -Encoding utf8
          "USERPROFILE=$p" | Add-Content $env:GITHUB_ENV -Encoding utf8
          "TEMP=$p\AppData\Local\Temp" | Add-Content $env:GITHUB_ENV -Encoding utf8
          "TMP=$p\AppData\Local\Temp" | Add-Content $env:GITHUB_ENV -Encoding utf8
          "APPDATA=$p\AppData\Roaming" | Add-Content $env:GITHUB_ENV -Encoding utf8
          "LOCALAPPDATA=$p\AppData\Local" | Add-Content $env:GITHUB_ENV -Encoding utf8
      - name: INSTALL.md steps 1-3 the Windows way, in PowerShell (as an agent without Git Bash would)
        shell: pwsh
        run: |
          "USERPROFILE=$env:USERPROFILE"
          "cwd=$(Get-Location)"
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.claude\skills\style-maker" | Out-Null
          foreach ($f in 'SKILL.md','axes.md','kit.py') { curl.exe -fsSL -o "$env:USERPROFILE\.claude\skills\style-maker\$f" "$env:RAW/$f"; "$f exit=$LASTEXITCODE" }
          Get-Item "$env:USERPROFILE\.claude\skills\style-maker\SKILL.md" | Format-List FullName, Length
          Get-Content "$env:USERPROFILE\.claude\skills\style-maker\SKILL.md" -TotalCount 1
      - name: place the owner's video (OneDrive Desktop, Hebrew name with a space)
        shell: bash
        run: |
          echo "bash sees HOME=$HOME"
          mkdir -p "$HOME/OneDrive/שולחן העבודה" && cp ci/animation/test-reel.mp4 "$HOME/OneDrive/שולחן העבודה/הסרטון שלי.mp4"
          ls -la "$HOME/OneDrive/שולחן העבודה"
      - name: INSTALL.md in Git Bash ("as on Mac, with curl.exe"), into a scratch folder under the same profile
        shell: bash
        run: |
          D=~/.claude/skills/gitbash-probe; mkdir -p $D
          for c in curl.exe curl; do $c -fsSL -o $D/SKILL-$c.md "$RAW/SKILL.md"; echo "$c exit=$? $(which $c)"; done
          ls -la $D; head -1 $D/SKILL-curl.exe.md
      - name: skill part 1 (step 1, install base, libs in background then exit)
        shell: bash
        run: bash ci/animation/run-skill.sh part1
      - name: skill part 2 (wait, model, doctor, steps 7-15)
        shell: bash
        run: bash ci/animation/run-skill.sh part2 "$HOME/OneDrive/שולחן העבודה/הסרטון שלי.mp4"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'win-${{ matrix.variant }}-logs', path: audit-logs }

  windows-no-git-probes:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: pwsh - SKILL.md step 1 detection line, bash and find resolution
        continue-on-error: true
        shell: pwsh
        run: |
          "PSVersion $($PSVersionTable.PSVersion)"
          "echo `$BASH_VERSION prints: [$BASH_VERSION]"
          Get-Command bash -All -ErrorAction SilentlyContinue | Format-Table Name, Source
          Get-Command find -All -ErrorAction SilentlyContinue | Format-Table Name, Source
          try { find ~/.claude/skills -maxdepth 1 -name 'reel-style-*' 2>&1 | Out-String } catch { "find threw: $_" }
          "find exit=$LASTEXITCODE"
      - name: pwsh - INSTALL-makers.md line 64 literal "mkdir %USERPROFILE%\.claude\skills\style-maker"
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\probe" | Out-Null; Set-Location "$env:RUNNER_TEMP\probe"
          mkdir %USERPROFILE%\.claude\skills\style-maker-probe
          "created:"; Get-ChildItem -Recurse -Directory | Select-Object -ExpandProperty FullName
          "exists under real profile: $(Test-Path "$env:USERPROFILE\.claude\skills\style-maker-probe")"
      - name: Windows PowerShell 5.1 - bare curl (bonus page says download with curl) vs curl.exe
        continue-on-error: true
        shell: powershell
        run: |
          "PSVersion $($PSVersionTable.PSVersion)"
          Set-Location $env:RUNNER_TEMP
          try { curl -fsSL -o t1.md https://raw.githubusercontent.com/themakers-y-d/makers-bonuses/main/style-maker/INSTALL-makers.md; "bare curl ok" } catch { "bare curl failed: $($_.Exception.Message)" }
          curl.exe -fsSL -o t2.md https://raw.githubusercontent.com/themakers-y-d/makers-bonuses/main/style-maker/INSTALL-makers.md; "curl.exe exit=$LASTEXITCODE size=$((Get-Item t2.md).Length)"
      - name: winget - is Git.Git installable per user (SKILL.md step 1 command)
        continue-on-error: true
        shell: pwsh
        run: |
          $w = Get-Command winget -ErrorAction SilentlyContinue
          if (-not $w) { "winget NOT present on this image"; exit 0 }
          winget --version
          winget show --id Git.Git -e --source winget --accept-source-agreements | Out-String
          "--- scope user manifest:"
          winget show --id Git.Git -e --source winget --scope user --accept-source-agreements | Out-String


  windows-no-git-new-text-probes:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: INSTALL.md (new) in PowerShell, from an unrelated folder, Hebrew profile
        run: |
          "PSVersion $($PSVersionTable.PSVersion)"
          # built from code points: Windows PowerShell 5.1 reads a BOM-less script file as ANSI (a harness limit, not the skill)
          $env:USERPROFILE = "C:\Users\" + (-join [char[]](0x05D3,0x05E0,0x05D4,0x20,0x05DB,0x05D4,0x05DF))
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\elsewhere" | Out-Null; Set-Location "$env:RUNNER_TEMP\elsewhere"
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.claude\skills\style-maker" | Out-Null
          foreach ($f in 'SKILL.md','axes.md','kit.py') { curl.exe -fsSL -o "$env:USERPROFILE\.claude\skills\style-maker\$f" "$env:RAW/$f"; "$f exit=$LASTEXITCODE" }
          Get-ChildItem "$env:USERPROFILE\.claude\skills\style-maker" | Format-Table FullName, Length
          "stray files in cwd: $((Get-ChildItem).Count)"
          Get-Content "$env:USERPROFILE\.claude\skills\style-maker\SKILL.md" -TotalCount 1 -Encoding UTF8
      - name: SKILL.md step 1 (new) detection line, verbatim
        run: |
          "echo BASH_VERSION -> [$BASH_VERSION]"
          $found = @("$env:ProgramFiles\Git\bin\bash.exe", "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe") | Where-Object { Test-Path $_ }
          "found: [$found]"
          "CLAUDE_CODE_GIT_BASH_PATH before: [$env:CLAUDE_CODE_GIT_BASH_PATH]"
          setx CLAUDE_CODE_GIT_BASH_PATH "$found"
          "exit=$LASTEXITCODE"
          "registry now: [$([Environment]::GetEnvironmentVariable('CLAUDE_CODE_GIT_BASH_PATH','User'))]"
          "this process still: [$env:CLAUDE_CODE_GIT_BASH_PATH] (a new window gets it)"
      - name: a NEW process sees it (as Claude Code started from a new window would)
        run: |
          "new step process: [$env:CLAUDE_CODE_GIT_BASH_PATH]"
          $v = [Environment]::GetEnvironmentVariable('CLAUDE_CODE_GIT_BASH_PATH','User'); if (-not $v) { exit 1 }
      - name: bonus page line, Windows form (curl.exe)
        run: |
          Set-Location $env:RUNNER_TEMP
          curl.exe -fsSL -o INSTALL-makers.md "https://raw.githubusercontent.com/themakers-y-d/makers-bonuses/${{ github.sha }}/style-maker/INSTALL-makers.md"; "exit=$LASTEXITCODE size=$((Get-Item INSTALL-makers.md).Length)"
      - name: INSTALL-makers.md line 64 (new) verbatim, then the download into it
        run: |
          # built from code points: Windows PowerShell 5.1 reads a BOM-less script file as ANSI (a harness limit, not the skill)
          $env:USERPROFILE = "C:\Users\" + (-join [char[]](0x05D3,0x05E0,0x05D4,0x20,0x05DB,0x05D4,0x05DF))
          Set-Location $env:RUNNER_TEMP
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.claude\skills\style-maker" | Out-Null; Set-Location "$env:USERPROFILE\.claude\skills\style-maker"
          "cwd now: $(Get-Location)"
